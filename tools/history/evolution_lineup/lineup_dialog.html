<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sibambo BOM Engine Evolution</title>
  <link rel="stylesheet" href="bomc_theme.css">
  <style>
    .settings-grid { display: grid; gap: 12px; }
    .batch-select { width: 100%; }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><span class="brand-name">Sibambo BOM Engine Evolution</span><span class="build" id="build"></span></div>
    <h1 id="title">Memuat engine…</h1>
    <p class="intro">E1–E3 memakai capture runtime yang sama dengan E4 kandidat. Pilih profil fidelity untuk model SketchUp yang sedang terbuka.</p>
    <section class="section settings-grid">
      <label class="field-label" for="profile">PROFILE</label>
      <select id="profile" class="select batch-select"><option value="visual">Visual</option><option value="research">Research</option><option value="exact">Exact</option></select>
      <label class="field-label" for="output">OUTPUT FILE</label>
      <div class="path-row"><input id="output" class="text-input" type="text" spellcheck="false"><button class="button" id="browse" type="button">Browse</button></div>
      <p class="path-note" id="path-note"></p>
    </section>
    <section class="section">
      <div class="section-head"><h2>Batch pemrosesan</h2></div>
      <select id="batch" class="select batch-select"><option>96</option><option>128</option><option>256</option><option selected>512</option><option>1024</option><option>2048</option><option>4096</option><option>8192</option></select>
    </section>
    <div class="actions"><span class="footer-note">Kandidat • belum certified</span><button class="button" id="cancel" type="button">Batal</button><button class="button button-primary" id="export" type="button">Export</button></div>
  </main>
  <script>
    let config = null;
    const byId = id => document.getElementById(id);
    const extension = engine => engine === 'e1' ? '.json' : engine === 'e2' ? '.json.gz' : '.cleanpkg';
    function normalizePath() {
      if (!config) return;
      const profile = byId('profile').value.toUpperCase();
      const engine = config.engine.toUpperCase();
      let path = byId('output').value.trim();
      path = path.replace(/__E[1-3]__(?:VISUAL|RESEARCH|EXACT)(?:\.json(?:\.gz)?|\.cleanpkg)$/i, '').replace(/(?:\.json(?:\.gz)?|\.cleanpkg)$/i, '');
      if (path) byId('output').value = `${path}__${engine}__${profile}${extension(config.engine)}`;
    }
    function setConfig(next) {
      config = next;
      byId('title').textContent = next.title;
      byId('build').textContent = `TREE ${next.sha.slice(0, 12)} · v${next.formatVersion}`;
      byId('output').value = next.output_path;
      byId('path-note').textContent = 'Artifact dan .provenance.json dipublikasikan sebagai satu pasangan setelah readback validation.';
    }
    function setPath(value) { byId('output').value = value; }
    byId('profile').addEventListener('change', normalizePath);
    byId('output').addEventListener('blur', normalizePath);
    byId('browse').addEventListener('click', () => window.sketchup.browse(byId('profile').value));
    byId('cancel').addEventListener('click', () => window.sketchup.cancel());
    byId('export').addEventListener('click', () => {
      normalizePath();
      window.sketchup.export(JSON.stringify({ output_path: byId('output').value.trim(), batch_size: Number(byId('batch').value), profile: byId('profile').value }));
    });
    window.setConfig = setConfig;
    window.setPath = setPath;
    window.sketchup.onReady();
  </script>
</body>
</html>
