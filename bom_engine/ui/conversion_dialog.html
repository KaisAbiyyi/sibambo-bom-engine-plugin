<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sibambo BOMC — proses</title>
  <link rel="stylesheet" href="bomc_theme.css">
  <style>
    [hidden] { display: none !important; }
    .shell { max-width: 680px; padding-top: 23px; }
    .state-head { display: flex; gap: 15px; margin-top: 22px; align-items: flex-start; }
    .status-icon { background: var(--maroon-wash); border-radius: 50%; color: var(--maroon); flex: none; font-size: 23px; font-weight: 750; height: 42px; line-height: 42px; text-align: center; width: 42px; }
    .done .status-icon { background: var(--maroon); color: white; }
    .failed .status-icon, .cancelled .status-icon { background: #f9e7e4; color: var(--danger); }
    h1 { margin: 0 0 5px; }
    .status-detail { color: var(--muted); font-size: 13px; line-height: 1.45; }
    .path-note { margin: 15px 0 0; max-height: 3em; overflow: hidden; }
    .track { background: #e9deda; border-radius: 20px; height: 8px; margin: 21px 0 15px; overflow: hidden; }
    .bar { background: var(--maroon); border-radius: inherit; height: 100%; width: 35%; animation: sweep 1.45s ease-in-out infinite alternate; }
    @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(280%); } }
    .determinate .bar { animation: none; transform: none; }
    .done .bar { animation: none; transform: none; width: 100% !important; }
    .failed .bar, .cancelled .bar { animation: none; transform: none; width: 100% !important; background: var(--danger); }
    #stage { font-size: 14px; font-weight: 650; overflow-wrap: anywhere; }
    .meta { color: var(--muted); display: flex; flex-wrap: wrap; gap: 7px 16px; font-size: 12px; margin-top: 8px; }
    .meta span + span::before { color: var(--border-strong); content: '·'; margin-right: 14px; }
    #result { margin-top: 19px; }
    .result-title { border-top: 1px solid var(--border); font-size: 13px; font-weight: 750; padding: 15px 0 7px; }
    .result-row { border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; }
    .result-row:last-child { border-bottom: 0; }
    .result-row strong { font-weight: 700; }
    #outcome-note { margin-top: 11px; }
    .actions { margin-top: 19px; }
    #open, #close { display: none; }
    .done #open, .done #close, .failed #close, .cancelled #close { display: inline-block; }
    .done #cancel, .failed #cancel, .cancelled #cancel { display: none; }
    @media (prefers-reduced-motion: reduce) { .bar { animation-duration: .01ms; } }
    @media (max-width: 480px) { .state-head { gap: 10px; } .status-icon { width: 36px; height: 36px; line-height: 36px; } }
  </style>
</head>
<body>
<main class="shell">
  <header class="brand">
    <svg viewBox="0 0 28 28" aria-hidden="true"><path fill="currentColor" d="M14 2 26 8v12L14 26 2 20V8L14 2Zm0 3.2L5.8 9.3 14 13.4l8.2-4.1L14 5.2Zm-9 6.5v6.4l7.5 3.8v-6.4L5 11.7Zm18 0-7.5 3.8v6.4l7.5-3.8v-6.4Z"/></svg>
    <span class="brand-name">Sibambo BOMC Engine</span><span class="build" id="build-label">Proses</span>
  </header>
  <div class="state-head">
    <div class="status-icon" id="status-icon" aria-hidden="true">···</div>
    <div><h1 id="title">Menyiapkan ekspor</h1><p class="status-detail" id="detail">Tunggu sampai hasilnya tercatat.</p></div>
  </div>
  <p class="path-note" id="path"></p>
  <div class="track" id="track" role="progressbar" aria-label="Kemajuan ekspor"><div class="bar" id="bar"></div></div>
  <div id="stage" role="status">Menyiapkan model…</div>
  <div class="meta"><span id="processed" hidden></span><span id="percent" hidden></span><span id="elapsed">0 detik</span></div>
  <div class="meta"><span id="source" hidden></span><span id="candidate" hidden></span></div>
  <div id="result" hidden><div class="result-title" id="result-title"></div><div id="result-rows"></div></div>
  <p class="note" id="outcome-note" hidden></p>
  <div class="actions">
    <button class="button" id="cancel" onclick="sketchup.cancel()">Batalkan</button>
    <button class="button" id="open" onclick="sketchup.openFolder()">Buka folder</button>
    <button class="button button-primary" id="close" onclick="sketchup.close()">Tutup</button>
  </div>
</main>
<script>
  var isCapture = false;
  var isBatchExport = false;
  function el(id) { return document.getElementById(id); }
  function formatBytes(value) {
    var n = Number(value);
    if (!Number.isFinite(n) || n < 0) return '—';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }
  function basename(path) { return String(path || '').split(/[\\/]/).pop(); }
  function row(label, value) {
    var item = document.createElement('div'); item.className = 'result-row';
    var name = document.createElement('span'); name.textContent = label;
    var number = document.createElement('strong'); number.textContent = value;
    item.appendChild(name); item.appendChild(number); el('result-rows').appendChild(item);
  }
  function resetProgressFacts() {
    ['processed', 'percent', 'source', 'candidate'].forEach(function(id) { el(id).hidden = true; });
    el('track').classList.remove('determinate');
    el('bar').style.width = '35%';
    el('track').removeAttribute('aria-valuenow');
  }
  function initializeConversion(data) {
    isCapture = data.capture === true;
    isBatchExport = data.batch_export === true;
    el('title').textContent = isCapture ? 'Menyiapkan capture' : isBatchExport ? 'Menyiapkan 3 profil' : 'Menyiapkan ekspor';
    el('detail').textContent = isCapture ? 'Visual, Research, dan Exact akan disimpan. Audit dilakukan terpisah.' :
      isBatchExport ? 'Visual, Research, dan Exact diproses berurutan ke folder baru. Hasil parsial bukan sukses.' : 'File diproses dengan validasi internal.';
    el('path').textContent = data.output_path || '';
    el('build-label').textContent = isCapture ? 'PREVIEW · belum tersertifikasi' : isBatchExport ? 'Export All · 3 profil' : 'Ekspor BOMC';
    resetProgressFacts();
  }
  function updateProgress(data) {
    var stage = String(data.stage || 'Memproses model').replaceAll('_', ' ').toLowerCase();
    var profile = data.profile ? String(data.profile).toUpperCase() + ' · ' : '';
    el('stage').textContent = profile + stage;
    var total = Number(data.total);
    var processed = Number(data.processed);
    if (Number.isFinite(total) && total > 0 && Number.isFinite(processed)) {
      var percent = Math.max(0, Math.min(100, processed * 100 / total));
      el('processed').textContent = processed.toLocaleString() + ' / ' + total.toLocaleString() + ' entitas';
      el('processed').hidden = false;
      el('percent').textContent = percent.toFixed(1) + '%';
      el('percent').hidden = false;
      el('track').classList.add('determinate');
      el('bar').style.width = percent + '%';
      el('track').setAttribute('aria-valuenow', percent.toFixed(1));
    } else { resetProgressFacts(); }
    el('elapsed').textContent = Number(data.elapsed_seconds || 0).toFixed(1) + ' detik';
    if (data.source_bytes != null) { el('source').textContent = 'SKP ' + formatBytes(data.source_bytes); el('source').hidden = false; }
    if (data.candidate_bytes != null) { el('candidate').textContent = 'Kandidat ' + formatBytes(data.candidate_bytes); el('candidate').hidden = false; }
  }
  function setCancelling() { el('stage').textContent = 'Menghentikan proses dengan aman…'; el('cancel').disabled = true; }
  function finish(status, title, detail) {
    document.body.className = status;
    el('status-icon').textContent = status === 'done' ? '✓' : '!';
    el('title').textContent = title; el('detail').textContent = detail;
    el('processed').hidden = true; el('percent').hidden = true; el('source').hidden = true; el('candidate').hidden = true;
  }
  function completeConversion(data) {
    var capture = data.capture === true;
    var batch = data.batch_export === true;
    finish('done', capture ? 'Capture tersimpan' : batch ? 'Tiga profil selesai' : 'Ekspor selesai',
      capture ? 'Tiga profil berhasil dibuat. Audit fidelity dan sertifikasi belum selesai.' :
      batch ? 'Tiga BOMC telah lolos validasi internal exporter. Ini bukan sertifikasi lintas-model.' :
      'Hasil telah melewati validasi internal exporter; bukan sertifikasi lintas-model.');
    el('path').textContent = data.path || '';
    el('stage').textContent = capture ? 'Belum siap rilis' : batch ? 'Tiga file BOMC tersimpan di folder baru' : 'File BOMC tersimpan';
    el('elapsed').textContent = Number(data.elapsed_seconds || 0).toFixed(1) + ' detik';
    el('result').hidden = false; el('result-rows').replaceChildren();
    el('result-title').textContent = capture || batch ? 'Hasil per profil' : 'Ukuran file';
    if (data.source_bytes != null) row('Sumber SKP' + (data.source_path ? ' · ' + basename(data.source_path) : ''), formatBytes(data.source_bytes));
    if (capture || batch) {
      ['visual', 'research', 'exact'].forEach(function(name) {
        var item = data.profiles && data.profiles[name];
        if (item && item.bytes != null) row(name[0].toUpperCase() + name.slice(1), formatBytes(item.bytes));
      });
      el('outcome-note').textContent = capture ?
        'Ini hanya capture kandidat. Ukuran file bukan bukti kesetiaan model atau kelayakan rilis.' :
        'Ketiga profil dibuat terpisah. Exact tidak dijamin lebih kecil; hasil ini belum certified untuk semua model.';
    } else {
      row('BOMC · ' + String(data.profile || 'profil').toUpperCase(), formatBytes(data.bytes));
      if (data.source_bytes != null && data.bytes != null) {
        var delta = Number(data.source_bytes) - Number(data.bytes);
        row('Selisih terhadap SKP', (delta < 0 ? 'lebih besar ' : 'lebih kecil ') + formatBytes(Math.abs(delta)));
      }
      if (data.texture_bytes != null) {
        var textureLabel = formatBytes(data.texture_bytes);
        if (data.texture_unique != null) textureLabel += ' · ' + Number(data.texture_unique).toLocaleString() + ' unik';
        row('Payload tekstur', textureLabel);
      }
      if (data.jcm_count != null && Number(data.jcm_count) > 0) {
        row('JCM Exact', Number(data.jcm_count).toLocaleString() + ' tekstur · ' + formatBytes(data.jcm_bytes || 0));
      } else if (String(data.profile || '').toLowerCase() === 'exact') {
        row('JCM Exact', '0 tekstur');
      }
      if (data.semantic_colorize_count != null && Number(data.semantic_colorize_count) > 0) {
        row('Semantic colorize', Number(data.semantic_colorize_count).toLocaleString() + ' tekstur native · ' + formatBytes(data.semantic_colorize_bytes || 0));
      } else if (String(data.profile || '').toLowerCase() === 'exact') {
        row('Semantic colorize', '0 tekstur');
      }
      (data.texture_encodings || []).forEach(function(encoding) {
        row('Encoding · ' + String(encoding.name || '').toUpperCase(),
          Number(encoding.count || 0).toLocaleString() + ' tekstur · ' + formatBytes(encoding.bytes || 0));
      });
      (data.top_sections || []).forEach(function(section, index) {
        row('Section #' + (index + 1) + ' · ' + String(section.name || ''), formatBytes(section.stored_bytes));
      });
      el('outcome-note').textContent = data.gate_status === 'over_budget' || data.gate_status === 'rejected_over_budget' ?
        'Target ukuran tidak tercapai. Jangan baca ini sebagai lulus batas ukuran.' :
        data.profile === 'exact' ? 'Exact menjaga fidelity; ukuran lebih kecil tidak dijamin.' :
        'Ukuran dan validasi internal ini belum membuktikan kesetiaan pada semua model SketchUp.';
    }
    el('outcome-note').hidden = false;
    el('open').style.display = 'inline-block';
  }
  function failConversion(data) {
    var batch = data.batch_export === true;
    var partial = batch && data.partial_result === true;
    finish('failed', 'Proses gagal', data.capture ? 'Capture tidak lengkap. Hasil awal dan diagnostik tetap ada di folder.' :
      batch ? (partial ? 'Export All tidak lengkap. File profil sebelumnya tetap ada di folder hasil.' : 'Export All belum menghasilkan file profil baru.') : 'BOMC baru tidak dinyatakan berhasil.');
    el('stage').textContent = data.message || 'Terjadi kesalahan.';
    el('path').textContent = data.path || '';
    el('outcome-note').textContent = data.capture ? 'Buka folder untuk melihat status dan diagnostik. Jangan gunakan hasil parsial sebagai rilis.' :
      batch ? (partial ? 'Periksa export-status.json dan export-error.log. Hasil parsial bukan ekspor tiga profil yang sukses.' : 'Perbaiki penyebab kegagalan sebelum mencoba lagi; file lama tetap aman.') : 'File lama tidak dinyatakan terganti; lihat log kesalahan.';
    el('outcome-note').hidden = false;
    el('open').style.display = data.capture || partial ? 'inline-block' : 'none';
  }
  function cancelledConversion(data) {
    data = data || {};
    var batch = data.batch_export === true;
    var partial = batch && data.partial_result === true;
    finish('cancelled', 'Proses dibatalkan', data.capture || partial ? 'Hasil profil sebelumnya mungkin masih ada.' : 'File baru tidak dinyatakan berhasil.');
    el('stage').textContent = 'Proses dihentikan.';
    el('path').textContent = data.path || '';
    el('outcome-note').textContent = data.capture || partial ? 'Periksa folder hasil dan status tiap profil sebelum memakai hasil parsial.' : 'Tidak ada sertifikasi yang diberikan.';
    el('outcome-note').hidden = false;
    el('open').style.display = data.capture || partial ? 'inline-block' : 'none';
  }
  window.onload = function() { sketchup.ready(); };
</script>
</body>
</html>
