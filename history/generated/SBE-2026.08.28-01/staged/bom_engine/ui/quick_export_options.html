<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><title>Quick Export Options</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#171c23;color:#dce5ee}body{padding:22px;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}h1{margin:0 0 5px;color:#4fffb0;font-size:18px}.intro{color:#91a1b1;font-size:12px}.modes{margin:18px 0 14px;display:grid;gap:9px}.mode{padding:12px;border:1px solid #344150;border-radius:8px;background:#202832;cursor:pointer}.mode.active{border-color:#4fffb0;background:#1d312d}.mode input{margin-right:8px;accent-color:#4fffb0}.mode strong{color:#edf6fb}#device{margin:3px 0 0 25px;color:#76d8b3;font-size:12px}.manual{display:flex;align-items:center;gap:12px;margin:4px 0 0 25px}select{min-width:120px;padding:7px;border:1px solid #415061;border-radius:5px;background:#151b22;color:#e4edf5}.disabled{opacity:.45;pointer-events:none}.notice{min-height:43px;padding:10px;border-radius:6px;background:#202832;color:#a9b8c6;font-size:12px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:17px}button{padding:8px 14px;border:0;border-radius:6px;cursor:pointer;font-weight:650}#cancel{background:#2b3541;color:#b8c4cf}#start{background:#4fffb0;color:#102019}</style></head><body>
<h1>Quick Export Model-Eval</h1><div class="intro">Pilih ukuran batch sebelum proses converting dimulai.</div><div class="modes"><label class="mode active" id="auto-card"><div><input type="radio" name="mode" value="auto" checked> <strong>Auto - direkomendasikan</strong></div><div id="device">Menganalisis kemampuan perangkat...</div></label><label class="mode" id="manual-card"><div><input type="radio" name="mode" value="manual"> <strong>Atur manual</strong></div><div class="manual disabled" id="manual-controls"><span>Batch geometri</span><select id="batch"><option>8</option><option>16</option><option>24</option><option>32</option><option>48</option><option>64</option><option>96</option><option>128</option><option>192</option><option>256</option><option>384</option><option>512</option><option>1024</option><option>2048</option><option>4096</option><option>8192</option></select></div></label></div><div class="notice">Untuk model kecil, coba 512-8192 agar overhead timer berkurang. Batch besar tidak memakai lebih banyak core atau GPU; ia menahan UI lebih lama sebelum SketchUp mendapat giliran lagi.</div><div class="actions"><button id="cancel" onclick="sketchup.cancel()">Batal</button><button id="start" onclick="start()">Mulai Converting</button></div>
<script>function selectedMode(){return document.querySelector('input[name="mode"]:checked').value}function refreshMode(){var manual=selectedMode()==='manual';document.getElementById('auto-card').classList.toggle('active',!manual);document.getElementById('manual-card').classList.toggle('active',manual);document.getElementById('manual-controls').classList.toggle('disabled',!manual)}function initializeQuickExportOptions(data){document.getElementById('device').textContent=data.cores+' logical cores terdeteksi - batch '+data.recommended_batch+' direkomendasikan';document.getElementById('batch').value=String(data.recommended_batch);document.querySelectorAll('input[name="mode"]').forEach(function(input){input.addEventListener('change',refreshMode)});refreshMode()}function start(){sketchup.start(JSON.stringify({mode:selectedMode(),batch_size:Number(document.getElementById('batch').value)}))}window.onload=function(){sketchup.ready()};</script></body></html>
