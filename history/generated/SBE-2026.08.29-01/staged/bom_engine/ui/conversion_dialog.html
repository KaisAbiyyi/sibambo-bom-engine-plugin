<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Converting Model</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #171c23; color: #dce5ee; }
  body { padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { margin: 0 0 8px; color: #4fffb0; font-size: 18px; font-weight: 650; }
  #path { color: #718295; font: 11px/1.4 Consolas, monospace; overflow-wrap: anywhere; min-height: 32px; }
  .track { height: 7px; margin: 22px 0 18px; overflow: hidden; border-radius: 20px; background: #29323e; }
  .bar { width: 38%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #35c98b, #68ffd0); animation: travel 1.4s ease-in-out infinite; }
  @keyframes travel { 0% { transform: translateX(-105%); } 100% { transform: translateX(265%); } }
  .done .bar { width: 100%; transform: none; animation: none; }
  .failed .bar, .cancelled .bar { width: 100%; transform: none; animation: none; background: #e66b73; }
  #stage { min-height: 22px; color: #c6d3df; font-size: 14px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 8px; color: #728395; font-size: 12px; }
  #summary { min-height: 40px; margin-top: 15px; color: #8ca0b2; font-size: 12px; line-height: 1.5; }
  .actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 15px; }
  button { padding: 8px 15px; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
  #cancel { background: #2b3541; color: #a9b6c3; }
  #open, #close { display: none; background: #4fffb0; color: #102019; }
</style>
</head>
<body>
  <h1 id="title">Converting model…</h1>
  <div id="path"></div>
  <div class="track" id="track"><div class="bar"></div></div>
  <div id="stage">Menyiapkan model…</div>
  <div class="meta"><span id="processed">0 / 0</span><span id="percent">0.0%</span><span id="mode">Balanced</span><span id="elapsed">0.0 detik</span></div>
  <div class="meta"><span id="source">SKP: unavailable</span><span id="candidate">BOMC: pending</span></div>
  <div id="summary">SketchUp tetap dapat merespons. Proses sengaja memakai batch kecil agar stabil pada device low-end.</div>
  <div class="actions">
    <button id="cancel" onclick="sketchup.cancel()">Batalkan</button>
    <button id="open" onclick="sketchup.openFolder()">Buka Folder</button>
    <button id="close" onclick="sketchup.close()">Tutup</button>
  </div>
<script>
  function initializeConversion(data) {
    document.getElementById('title').textContent = data.title;
    document.getElementById('path').textContent = data.output_path;
    if (data.batch_size) document.getElementById('summary').textContent = 'Batch geometri ' + data.batch_size + '. SketchUp tetap responsif selama converting.';
  }
  function updateProgress(data) {
    document.getElementById('stage').textContent = String(data.stage).replaceAll('_', ' ');
    document.getElementById('processed').textContent = data.processed.toLocaleString() + ' / ' + (data.total || 0).toLocaleString();
    document.getElementById('percent').textContent = (data.percent || 0).toFixed(1) + '%';
    var modeLabel = data.mode === 'light' ? 'Light / Stable' : (data.mode || 'Balanced');
    document.getElementById('mode').textContent = modeLabel;
    document.getElementById('elapsed').textContent = data.elapsed_seconds.toFixed(1) + ' detik';
    document.getElementById('source').textContent = 'SKP: ' + (data.source_bytes == null ? 'unavailable' : formatBytes(data.source_bytes));
    document.getElementById('candidate').textContent = 'BOMC: ' + (data.candidate_bytes == null ? 'pending' : formatBytes(data.candidate_bytes));
  }
  function setCancelling() {
    document.getElementById('stage').textContent = 'Membatalkan dengan aman…';
    document.getElementById('cancel').disabled = true;
  }
  function completeConversion(data) {
    document.body.className = 'done';
    document.getElementById('title').textContent = 'Converting selesai';
    document.getElementById('stage').textContent = 'File siap digunakan oleh model-eval.';
    document.getElementById('elapsed').textContent = data.elapsed_seconds.toFixed(1) + ' detik';
    var gate = data.gate_status === 'pass'
      ? 'PASS · saved ' + formatBytes(data.savings_bytes || 0)
      : (data.gate_status === 'over_budget'
        ? 'COMPLETE · ' + formatBytes(Math.abs(data.savings_bytes || 0)) + ' larger than SKP'
        : 'source-size unavailable');
    document.getElementById('summary').textContent = (data.nodes || 0).toLocaleString() + ' objek · ' + (data.triangles || 0).toLocaleString() + ' triangles · ' + formatBytes(data.bytes || 0) + ' · ' + gate;
    finishActions(true);
  }
  function failConversion(data) {
    document.body.className = 'failed';
    document.getElementById('title').textContent = 'Converting gagal';
    document.getElementById('stage').textContent = data.message || 'Terjadi kesalahan.';
    document.getElementById('summary').textContent = 'File lama tetap aman; file sementara dibersihkan.';
    finishActions(false);
  }
  function cancelledConversion() {
    document.body.className = 'cancelled';
    document.getElementById('title').textContent = 'Converting dibatalkan';
    document.getElementById('stage').textContent = 'Tidak ada file parsial yang dipakai.';
    finishActions(false);
  }
  function finishActions(canOpen) {
    document.getElementById('cancel').style.display = 'none';
    document.getElementById('open').style.display = canOpen ? 'inline-block' : 'none';
    document.getElementById('close').style.display = 'inline-block';
  }
  function formatBytes(value) {
    if (value < 1024) return value + ' B';
    if (value < 1048576) return (value / 1024).toFixed(1) + ' KB';
    return (value / 1048576).toFixed(1) + ' MB';
  }
  window.onload = function() { sketchup.ready(); };
</script>
</body>
</html>
