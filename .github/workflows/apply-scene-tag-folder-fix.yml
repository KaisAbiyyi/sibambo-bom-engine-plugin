name: Apply Scene Tag Folder Fix

on:
  push:
    branches: [feat/scene-str-border-fidelity]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/scene-str-border-fidelity
          fetch-depth: 0
      - name: Apply production patch
        run: python .github/scripts/apply-scene-tag-folder-fix.py
      - name: Focused Scene truth tests
        run: |
          ruby -I bom_engine/tests bom_engine/tests/test_scene_tag_folder_truth.rb
          ruby -I bom_engine/tests bom_engine/tests/test_scene_visibility_resolver.rb
      - name: Full producer Ruby suite
        run: |
          for file in bom_engine/tests/test_*.rb; do
            echo "==> $file"
            ruby -I bom_engine/tests "$file"
          done
      - name: Commit verified production fix
        run: |
          rm .github/scripts/apply-scene-tag-folder-fix.py .github/workflows/apply-scene-tag-folder-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(scene): preserve per-page tag-folder visibility truth"
          git push origin HEAD:feat/scene-str-border-fidelity
