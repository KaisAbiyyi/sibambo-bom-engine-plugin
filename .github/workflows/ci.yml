name: Producer CI

on:
  push:
    branches: [main, feat/*, 'feat/**']
    tags: ['*']
  pull_request: {}

jobs:
  windows-png-worker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Verify detached PNG worker and cooperative boundaries
        shell: pwsh
        run: |
          $env:TEMP = Join-Path $env:GITHUB_WORKSPACE 'scratch/png-worker-temp'
          $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
          foreach ($test in @('test_windows_codec_process.rb', 'test_candidate013_png_worker.rb', 'test_candidate013_cooperation.rb', 'test_candidate012_cooperation.rb')) {
            ruby "bom_engine/tests/$test"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Set up Node for dialog checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install isolated Chromium test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/sibambo-ui" @playwright/test@1.61.1
          "$RUNNER_TEMP/sibambo-ui/node_modules/.bin/playwright" install --with-deps chromium

      - name: Fetch provenance source histories
        run: |
          git fetch origin feature/clean-json-export
          git fetch https://github.com/rdwnilyas-coder/sibambo-bom-engine.git main

      - name: Run BOM Engine Production Tests
        run: |
          set -euo pipefail
          for f in bom_engine/tests/test_*.rb; do
            echo "Running $f..."
            ruby -I . "$f"
          done

      - name: Build Evolution Lab Packages
        run: ruby tools/history/build_evolution_lab.rb

      - name: Run History & Provenance Tests
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/sibambo-ui/node_modules/@playwright/test
        run: |
          set -euo pipefail
          for f in history/tests/test_*.rb; do
            echo "Running $f..."
            ruby "$f"
          done

      - name: Build current Evolution lineup candidate
        run: ruby tools/history/build_evolution_lineup.rb --output "$RUNNER_TEMP/evolution-lineup-candidate"

      - name: Preserve candidate RBZ and identity manifest
        uses: actions/upload-artifact@v4
        with:
          name: evolution-lineup-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/evolution-lineup-candidate/*.rbz
            ${{ runner.temp }}/evolution-lineup-candidate/manifest.json
          if-no-files-found: error
